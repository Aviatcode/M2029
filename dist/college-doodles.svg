    <text x="18" y="22" font-family="serif" font-size="14" fill="currentColor" stroke="none">f(x)dx</text>
    <text x="8" y="52" font-family="serif" font-size="11" fill="currentColor" stroke="none">a</text>
    <text x="14" y="14" font-family="serif" font-size="11" fill="currentColor" stroke="none">b</text>
    <text x="65" y="38" font-family="serif" font-size="20" fill="currentColor" stroke="none">=</text>
    <path d="M90,16 L114,16 L100,32 L114,48 L90,48" />
