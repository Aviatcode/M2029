<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- College Doodles Seamless Pattern -->

  <!-- 1. Mortarboard / Graduation Cap (Top Left: 50, 60) -->
  <g transform="translate(40, 45) scale(0.95)">
    <polygon points="45,15 85,32 45,49 5,32" />
    <path d="M22,39 L22,60 C22,70 68,70 68,60 L68,39" />
