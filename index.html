    <meta property="og:description" content="Autonomous curriculum operating system that parses your syllabus, delivers 7 AM pre-lecture ELI9 primers, visual mindmaps, university 10-marker answers, PYQs, and shared token-saving classroom cache with installable WebAPK PWA support." />

    <!-- WebAPK / PWA Meta Tags -->

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Google Fonts: Newsreader (Editorial Serif), Plus Jakarta Sans (Modern Sans), & JetBrains Mono (Academic Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500;1,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
      // Suppress benign Vite dev server WebSocket disconnect errors in cloud proxy / iframe environments
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.indexOf('WebSocket') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || '')) || '';
        if (msg.indexOf('WebSocket') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/20 selection:text-cyan-200">
    <div id="root"></div>

  </body>
